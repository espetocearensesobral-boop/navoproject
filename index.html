      const originalConsoleWarn = console.warn;

        if (typeof args[0] === 'string' && (args[0].includes('lazy') || args[0].includes('Intervention'))) {
          return; // Silencia warnings de lazy loading
        }
        originalConsoleWarn.apply(console, args);
      };
    </script>
